<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12A594"/>
      <stop offset="1" stop-color="#063B37"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#032522" flood-opacity="0.36"/>
    </filter>
  </defs>

  <!-- rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- A sound wave with an arrow leaving it: one song, sent on to wherever the
       listener plays music. The wave alone would have said "audio player";
       the arrow is the link, and the link is the whole package.

       Deep teal, darker than Identity Contracts, because the bright greens and
       blues are taken and a smartlink page is mostly a dark stage. -->
  <g filter="url(#sh)" fill="#FFFFFF">
    <rect x="104" y="214" width="40" height="112" rx="20"/>
    <rect x="168" y="150" width="40" height="240" rx="20"/>
    <rect x="232" y="100" width="40" height="340" rx="20"/>
    <rect x="296" y="176" width="40" height="128" rx="20"/>
    <circle cx="384" cy="384" r="64"/>
  </g>

  <!-- the arrow out, in the badge. The badge keeps a gap to the last bar, or
       at 24 pixels the two merge into a letter. -->
  <path d="M360 408 L408 360 M372 358 L410 358 L410 396" stroke="url(#bg)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
